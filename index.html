<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ApexForm AI - Gym Form Analyzer</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="header">
    <h1 class="header__title">ApexForm AI</h1>
  </header>
  
  <main class="main-content">
    <section class="media-frame">
      <video id="webcam" class="media-frame__video" playsinline autoplay muted></video>
      <canvas id="output-canvas" class="media-frame__canvas"></canvas>
    </section>
    
    <nav class="control-panel">
      <select id="exercise-select" class="btn btn--primary">
        <option value="SQUAT">Squat Rules</option>
        <option value="BICEP_CURL">Bicep Curl Rules</option>
      </select>
      <button id="start-btn" class="btn btn--primary">Start Stream</button>
      <button id="switch-btn" class="btn btn--primary" disabled>Switch Camera</button>
      <button id="stop-btn" class="btn btn--danger" disabled>Stop Stream</button>
    </nav>
    
    <section class="log-panel">
      <h2 class="log-panel__title">Console Log</h2>
      <div id="log" class="log-panel__console">Ready to initialize stream...</div>
    </section>
  </main>

  <div id="summary-modal" class="modal">
    <div class="modal__content">
      <h2 class="modal__title">Set Summary Analytics</h2>
      <div class="modal__stats">
        <div class="modal__stat-item">
          <span class="modal__stat-label">Total Reps</span>
          <span id="stat-reps" class="modal__stat-value">0</span>
        </div>
        <div class="modal__stat-item">
          <span class="modal__stat-label">Form Accuracy</span>
          <span id="stat-accuracy" class="modal__stat-value">100%</span>
        </div>
        <div class="modal__stat-item">
          <span class="modal__stat-label">Average Peak Angle</span>
          <span id="stat-angle" class="modal__stat-value">0°</span>
        </div>
      </div>
      <button id="modal-close-btn" class="btn btn--primary modal__close-btn">Save & Close</button>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
