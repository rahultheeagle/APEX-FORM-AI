<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ApexForm AI - 3D Holographic Biomechanical HUD</title>
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Cyber-tech Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body class="viewport-app">
  <!-- Fullscreen Spatial Viewport -->
  <main class="spatial-viewport">
    <!-- Camera Feed and 3D Canvas Layer -->
    <div class="viewport-media">
      <video id="webcam" class="viewport-video" playsinline autoplay muted></video>
      <canvas id="output-canvas" class="viewport-canvas"></canvas>
    </div>

    <!-- Full-Screen Spatial Floating Overlays -->
    <div class="spatial-hud">
      <!-- Top Session Bar -->
      <header class="hud-topbar">
        <div class="hud-topbar__left">
          <div class="hud-live-pill">
            <span class="hud-live-dot"></span>
            <span class="hud-live-text">OPTICS LIVE</span>
          </div>
          <div class="hud-timer-badge">
            <span class="hud-timer-label">SESSION</span>
            <span id="session-timer" class="hud-timer-value">00:00</span>
          </div>
        </div>

        <div class="hud-topbar__center">
          <div class="brand-badge">
            <span class="brand-badge__apex">APEX</span><span class="brand-badge__form">FORM</span>
            <span class="brand-badge__tag">3D HOLOGRAPHIC</span>
          </div>
        </div>

        <div class="hud-topbar__right">
          <div id="exercise-badge" class="hud-exercise-pill">SQUAT</div>
          <div id="hud-status-badge" class="hud-status-pill hud-status-pill--standby">STANDBY</div>
        </div>
      </header>

      <!-- Center-Left Rep Counter Card -->
      <aside class="hud-rep-card">
        <div class="hud-rep-card__glow"></div>
        <span class="hud-rep-card__tag">TOTAL REPS</span>
        <span id="hud-rep-count" class="hud-rep-card__count">0</span>
        <div class="hud-rep-card__status">
          <span class="hud-rep-card__status-dot"></span>
          <span id="hud-state-display" class="hud-rep-card__status-text">STANDBY</span>
        </div>
      </aside>

      <!-- Bottom Floating Control Dock -->
      <footer class="hud-dock">
        <div class="hud-dock__glass">
          <div class="select-cyber-wrap">
            <select id="exercise-select" class="cyber-select">
              <option value="SQUAT">Squat Biomechanics</option>
              <option value="BICEP_CURL">Bicep Curl Biomechanics</option>
            </select>
          </div>

          <button id="start-btn" class="cyber-btn cyber-btn--primary">
            <span class="cyber-btn__icon">▶</span>
            <span class="cyber-btn__text">Start Session</span>
          </button>

          <button id="switch-btn" class="cyber-btn cyber-btn--secondary" disabled>
            <span class="cyber-btn__icon">⟲</span>
            <span class="cyber-btn__text">Flip Lens</span>
          </button>

          <button id="stop-btn" class="cyber-btn cyber-btn--danger" disabled>
            <span class="cyber-btn__icon">■</span>
            <span class="cyber-btn__text">Finish Set</span>
          </button>

          <!-- Toggleable Telemetry Stream Pill -->
          <button id="toggle-telemetry-btn" class="cyber-btn cyber-btn--ghost" title="Toggle Telemetry Stream">
            <span class="cyber-btn__icon">⚡</span>
          </button>
        </div>

        <!-- Telemetry Log Drawer (compact & expandable) -->
        <div id="telemetry-drawer" class="telemetry-drawer telemetry-drawer--minimized">
          <div class="telemetry-drawer__header">
            <span class="telemetry-drawer__dot"></span>
            <span class="telemetry-drawer__title">TELEMETRY STREAM</span>
          </div>
          <div id="log" class="telemetry-drawer__content">Ready to stream...</div>
        </div>
      </footer>
    </div>
  </main>

  <!-- Summary Modal Card -->
  <div id="summary-modal" class="modal">
    <div class="modal__content">
      <div class="modal__glow-sphere"></div>
      <h2 class="modal__title">WORKOUT ANALYTICS</h2>
      <div class="modal__stats">
        <div class="modal__stat-item">
          <span class="modal__stat-label">TOTAL REPS</span>
          <span id="stat-reps" class="modal__stat-value">0</span>
        </div>
        <div class="modal__stat-item">
          <span class="modal__stat-label">FORM ACCURACY</span>
          <span id="stat-accuracy" class="modal__stat-value">100%</span>
        </div>
        <div class="modal__stat-item">
          <span class="modal__stat-label">AVG PEAK DEPTH</span>
          <span id="stat-angle" class="modal__stat-value">0°</span>
        </div>
      </div>
      <button id="modal-close-btn" class="cyber-btn cyber-btn--primary modal__close-btn">SAVE & ARCHIVE</button>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
